name: test-pipeline

# Self-checks run immediately before the pipeline, in the same command
# (pipeline-pattern.md §3, "Cheap checks gate expensive spend").

# Dispatch-only, deliberately: the pipeline runs on a DEPLOYMENT, never on a PR of its own.
#
# The product CICD triggers this after its deploy and passes the testing context with it —
# `pr` (the PR whose change is under test) and `source_repo` (the repo that PR lives in).
# There is deliberately NO `pull_request` trigger on this repo: stage 8 OPENS a PR here, so
# a `pull_request` trigger would run the pipeline against its own generated tests, generate
# more, and open a further PR — a loop fed by every delivery.
on:
  # Manual run, and the entry the product CICD calls. Inputs are typed at run time — which
  # is why `test_grep` may live here but never in the `env:` block below.
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number for stage 1 to read (its issue + diff). Leave empty if using from_scenarios.'
        required: false
        type: string
      source_repo:
        description: 'owner/name of the repo whose PR is under test, when it is not this repo (a product repo triggering this pipeline after its deploy). Empty = this repo.'
        required: false
        type: string
      from_scenarios:
        description: 'Skip stage 1. Digest the scenario files as they are — no PR needed.'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Stop before the world changes: skips stage 6 (browser) and stage 8 (git push/PR).'
        required: false
        default: false
        type: boolean
      test_grep:
        description: 'Operator override: run only tests matching this grep (e.g. @smoke). Skips the planner agent and the floor. Empty = let the planner decide.'
        required: false
        type: string
      base_branch:
        description: 'Branch for stage 8 to base the delivery branch on. Empty = main.'
        required: false
        type: string

# Stage 8 creates a branch, pushes it and opens a PR, and stage 1 comments on the
# source PR. New repositories default GITHUB_TOKEN to read-only, so without this the
# delivery stages fail at the last step of a run that otherwise succeeded.
permissions:
  contents: write
  pull-requests: write

jobs:
  self-checks-and-pipeline:
    runs-on: ubuntu-latest
    env:
      # THREE registration points (pipeline-pattern.md §5): this definition,
      # the container environment (the browser step below), and .env.example.
      BASE_URL: ${{ vars.BASE_URL }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      MODEL_CONCURRENCY: '4'
      # Debug logging toggle. Registered here (the container environment that the
      # tests run in) as well as .env.example — a value set only in a step's shell
      # never reaches the test process.
      DEBUG: ${{ vars.DEBUG }}
      # Reasoning models spend the pipeline's small token budgets on thinking and
      # return null content unless this is set to none/minimal.
      MODEL_REASONING_EFFORT: ${{ vars.MODEL_REASONING_EFFORT }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The WORK repo: `github.repository` is the repo this workflow runs in, so it is the
      # one the tests are committed, pushed and PR'd to — never the product repo.
      WORK_REPO_SLUG: ${{ github.repository }}
      # The SOURCE repo, supplied by the product CICD with the testing context: whose change
      # is under test. Empty = this repo.
      SOURCE_REPO_SLUG: ${{ inputs.source_repo }}
      # The branch the delivery branch is based on. Empty is correct rather than harmful:
      # stage 8 uses `main` when SOURCE_BRANCH is unset.
      SOURCE_BRANCH: ${{ inputs.base_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browsers (container environment registration point)
        run: npx playwright install --with-deps chromium

      - name: Self-checks + typecheck
        run: npm run typecheck && npm run self-checks

      - name: Pipeline
        env:
          # Tests run inside the container — a value set only in this step's
          # shell never reaches them. Register at the job env level (above).
          # The testing context the product CICD hands over: the PR whose change is under
          # test, read from SOURCE_REPO_SLUG.
          TCGEN_PR: ${{ inputs.pr }}
          TCGEN_FROM_SCENARIOS: ${{ inputs.from_scenarios }}
          TCGEN_DRY_RUN: ${{ inputs.dry_run }}
          # The operator's override, and ONLY theirs: sourced from a run-time input,
          # never from a repository variable. A standing value would pin every run to
          # one person's filter and the pipeline would quietly stop planning. An empty
          # input reads as unset (core/util/env.ts), so no override is applied.
          TEST_GREP: ${{ inputs.test_grep }}
          # Whether that value came from the operator at run time. Stage 5 uses it to tell
          # a decision from a leftover: a stray TEST_GREP narrowing a CI run is the silent
          # smaller-green this pipeline exists to prevent, while one typed into the manual
          # trigger is the override working as intended. 'environment' is the honest
          # default — nothing in this workflow supplies the value any other way.
          TEST_GREP_SOURCE: ${{ inputs.test_grep != '' && 'input' || 'environment' }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$TCGEN_PR" ]; then
            args+=(--pr "$TCGEN_PR")
          elif [ "$TCGEN_FROM_SCENARIOS" = "true" ]; then
            args+=(--from-scenarios)
          else
            echo "::error::Nothing to run. Supply a PR number, or tick 'from_scenarios' for a manual run with no PR."
            exit 1
          fi
          if [ "$TCGEN_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          [ -n "${TEST_GREP:-}" ] && echo "override active: TEST_GREP=$TEST_GREP (the planner agent will be skipped)"
          echo "pipeline args: ${args[*]}"
          npm run pipeline -- "${args[@]}"

      - name: Upload the run record
        # On failure too: a red run is exactly when a reviewer needs the detail.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run
          # The PR body states the result and the scope; these files are the evidence
          # behind it — a failing test's trace and the full run report. `artifacts/` is
          # gitignored, so without this upload the PR body is the only record that
          # survives, and "1 failed" is unactionable on its own.
          path: |
            artifacts/run/
            artifacts/run-report/
          if-no-files-found: ignore
